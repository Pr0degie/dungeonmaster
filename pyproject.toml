[project]
name = "cogitator"
version = "0.0.0"
description = "Cogitator — a local, system-agnostic AI game master for tabletop RPGs (DMbot: the DM brain)."
# Pinned to the 3.12 line: it's the project runtime (CLAUDE.md), and it keeps the universal
# resolver from forking a 3.13 split where CUDA torch's linux cudnn pin (==9.10.2.21) clashes
# with faster-whisper's win32 cudnn (>=9.23). We never run 3.13 here.
requires-python = ">=3.12,<3.13"
# Dependencies are added per-phase with `uv add` (see the model/effort + phase plan in
# roadmap.md). Phase 0 needs none — it is install + config + smoke test only.
# New heavy deps must be justified in the commit/PR and architecture.md §3 (golden rule #9).
dependencies = [
    "colorama>=0.4.6",
    "coqui-tts>=0.27.5",
    # Voice-receive core is PINNED EXACTLY, not >=. The DAVE/E2EE decrypt reaches into a
    # discord.py internal (`_connection.dave_session`, ADR 006) and voice-recv is an alpha
    # whose sink callback signature can shift — a drift here yields a garbage transcript, not
    # an error. Pinning keeps an unrelated `uv add`/`uv lock --upgrade` from moving the kernel.
    # Bump these three together, deliberately, and re-run the preflight + live re-verify
    # (dmbot/voice/preflight.py KNOWN_GOOD; the verified-stack table in ADR 006).
    "davey==0.1.5",
    "discord-ext-voice-recv==0.5.2a179",
    "discord-py[voice]==2.7.1",
    "faster-whisper>=1.2.1",
    "httpx>=0.28.1",
    "numpy>=2.4.6",
    # faster-whisper's CUDA-12 DLLs (ctranslate2), needed only on the Windows runtime (D16) — the
    # transcriber registers their wheel bin dirs via os.add_dll_directory. Marked win32-only so
    # they don't collide with the cudnn version CUDA torch pins on linux (==9.10.2.21 there).
    # cudart (cuda-runtime) is REQUIRED: cublas64_12.dll depends on cudart64_12.dll — without it
    # GPU whisper fails with "cublas64_12.dll cannot be loaded". Keep this CUDA-12 trio complete
    # and independent of torch's CUDA version (torch is on cu130 / CUDA 13).
    "nvidia-cublas-cu12>=12.9.2.10 ; sys_platform == 'win32'",
    "nvidia-cuda-runtime-cu12>=12.9.79 ; sys_platform == 'win32'",
    "nvidia-cudnn-cu12>=9.23.0.39 ; sys_platform == 'win32'",
    "onnxruntime>=1.26.0",
    "piper-tts>=1.4.2",
    "python-dotenv>=1.2.2",
    "soxr>=1.1.0",
    "torch>=2.12.0",
    "torchaudio>=2.11.0",
    "torchcodec>=0.14.0",
    "transformers<5",
]

[tool.uv]
# This is an application, not an installable library — no build backend needed.
package = false

# Windows-only runtime (D16): both target boxes (4070 dev, 5080 full-GPU) run Windows. Locking
# only for win32 keeps the universal resolver from considering CUDA torch's linux-only cudnn pin
# (==9.10.2.21), which would otherwise clash with faster-whisper's win32 cudnn (>=9.23).
environments = ["sys_platform == 'win32'"]

# CUDA torch (heavy dep, golden rule #9 — justified in architecture.md §3 + ADR 009).
# Default PyPI ships torch as a CPU-only build (torch X.Y.Z+cpu), so XTTS could only ever
# run on the CPU (~1.5x realtime, multi-second sentences). Pulling torch/torchaudio/torchcodec
# from PyTorch's CUDA index gives the +cuXXX builds so XTTS runs on the GPU. The SAME lock
# works on both target boxes (4070 dev, 5080 full-GPU); a machine without a usable GPU degrades
# to CPU at runtime (dmbot/tts/xtts.py _resolve_device). **cu130** (CUDA 13.0) carries torch
# 2.12.0 for Windows/cp312 AND supports both Ada (4070, sm_89) and **Blackwell (5080, sm_120)** —
# cu126 tops out at sm_90 and fails on the 5080. Bump together with the torch pin if torch moves.
[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cuda" }
torchaudio = { index = "pytorch-cuda" }
torchcodec = { index = "pytorch-cuda" }
